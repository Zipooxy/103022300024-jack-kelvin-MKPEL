name: CI/CD - 103022300024 Jack Kelvin MKPEL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # =============================================
  # 1. CONTINUOUS INTEGRATION (25 poin)
  # =============================================
  continuous-integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B compile --file pom.xml

  # =============================================
  # 2. CONTINUOUS TESTING (25 poin)
  # =============================================
  continuous-testing:
    name: Continuous Testing
    runs-on: ubuntu-latest
    needs: continuous-integration

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn -B test --file pom.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/

  # =============================================
  # 3. CONTINUOUS INSPECTION (35 poin)
  # =============================================
  continuous-inspection:
    name: Continuous Inspection
    runs-on: ubuntu-latest
    needs: continuous-testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify sonar:sonar \
            -Dsonar.projectKey=103022300024-jack-kelvin-MKPEL \
            -Dsonar.organization=jack-kelvin \
            -Dsonar.host.url=https://sonarcloud.io \
            --file pom.xml

  # =============================================
  # 4. CONTINUOUS DELIVERY / DEPLOY (15 poin)
  # =============================================
  continuous-delivery:
    name: Continuous Delivery / Deploy
    runs-on: ubuntu-latest
    needs: continuous-inspection

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package application
        run: mvn -B package -DskipTests --file pom.xml

      - name: Upload artifact (JAR)
        uses: actions/upload-artifact@v3
        with:
          name: app-jar-103022300024-jack-kelvin
          path: target/*.jar
          retention-days: 7
